[project]
name = "notification-tester"
version = "0.1.0"
description = "Test phone and desktop notifications: sign a device up on one page, send it pushed or live notifications from another"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "app-schema",
    "flask>=3.0",
    "flask-sock>=0.7",
    "imbue-common",
    "pydantic>=2.0",
    "werkzeug>=3.0",
    "pywebpush>=2.0",
]

[project.scripts]
notification-tester = "notification_tester.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notification_tester"]

[dependency-groups]
dev = [
    # What runner_test.py asserts the API document with.
    "app-schema[testing]",
    # Used by test_no_type_errors in the ratchets, pinned to the version the shell and chat use.
    "ty==0.0.85",
]

# Makes this directory ty's project; without a [tool.ty] table ty keeps searching upward.
[tool.ty]
