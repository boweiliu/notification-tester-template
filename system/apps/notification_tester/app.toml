name = "notification-tester"
display_name = "Notification tester"
# What the app is for, in the person's terms: what an agent reads to decide whether this app
# does what it needs. The app's API document (served at api_schema_path) carries it too.
description = "Test phone and desktop notifications: sign a device up on one page, send it pushed or live notifications from another"
api_schema_path = "/api/schema"
icon = "icon.svg"
priority = "user"
program = "notification-tester"
# The shell stops the app once no window shows it (a minute after the last one
# closes) and starts it again on the next request; false keeps it running for
# the life of the workspace. Set false if the app does work between requests
# (a background thread, a poller, a scheduled refresh, a subscription to an
# outside service, a job that outlives the window): a stop loses that work.
stop_when_no_windows = false

[[references]]
path = "system/supervisord.conf.d/notification-tester.conf"
note = "Runs this app and registers its port; the portable installer generates the equivalent for its target root and port"

[[references]]
path = ".agents/skills/notify-user/scripts/notify_user.py"
note = "Optional platform notifier copy to POST /api/chat-notifications; portable installs use the app-owned additive integration helper"

[[references]]
path = ".agents/skills/notify-user/scripts/notify_user_test.py"
note = "Checks the existing platform notifier copy integration; not a portable replacement for the target platform notifier"

# How update-app boots a throwaway preview of this app: on a free port, over a
# scratch copy of its data (see .agents/skills/update-app/scripts/preview_app.py).
[preview]
env = {NOTIFICATION_TESTER_PORT = "{port:main}", NOTIFICATION_TESTER_HOST = "{host}", NOTIFICATION_TESTER_DATA_DIR = "{copy:data}"}
copies = {data = "data/.apps/notification-tester"}
